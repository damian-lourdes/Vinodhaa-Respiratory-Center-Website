  <path d="M250 132 C 300 130, 300 192, 334 182 C 360 174, 352 136, 326 126" stroke="#cfd6e0" stroke-width="13" stroke-linecap="round"/>
  <path d="M250 132 C 300 130, 300 192, 334 182 C 360 174, 352 136, 326 126" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 5"/>
