    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e8ecf1"/></linearGradient>
    <radialGradient id="sh" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#16306e" stop-opacity=".18"/><stop offset="1" stop-color="#16306e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="400" height="240" fill="url(#bg)"/>
